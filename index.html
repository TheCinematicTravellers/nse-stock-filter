<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside @ 50 EMA</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#eef2f5}*{box-sizing:border-box}body{margin:0}.app{max-width:1500px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #272c32;padding-bottom:22px}.eyebrow{font-size:12px;letter-spacing:2px;color:#7f8a95}h1{margin:5px 0;font-size:34px}header p{margin:0;color:#8e99a5}.clock{font-family:monospace;color:#9ba6b2}nav{display:flex;gap:8px;margin:18px 0}button{background:#15191e;border:1px solid #30363d;color:#bfc7cf;padding:10px 16px;border-radius:8px;cursor:pointer}button.on,button:hover{border-color:#75808b;color:white}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 16px}.statuscard{background:#101419;border:1px solid #272d34;border-radius:12px;padding:14px}.statuscard small{display:block;color:#7d8791;font-size:10px;letter-spacing:1px;margin-bottom:6px}.statuscard strong{font-size:19px}.online{color:#55d6a5}.offline{color:#ff7181}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#101419;border:1px solid #272d34;border-radius:14px;padding:18px;min-height:180px}.panel h2{font-size:15px;margin:0 0 14px}.cards{display:grid;gap:10px}.card{background:#161b21;border:1px solid #2b323a;border-radius:10px;padding:14px}.row{display:flex;justify-content:space-between;font-size:17px}.long{color:#55d6a5}.short{color:#ff7181}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.levels small{display:block;color:#7d8791;font-size:10px}.levels strong{font-size:16px}.meta{margin-top:13px;font-size:11px;color:#7e8994}.empty{color:#59636d;font-size:13px;padding:18px 4px}.ledger{background:#101419;border:1px solid #272d34;border-radius:14px;padding:18px;overflow:auto}.ledger h2{font-size:15px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 9px;border-bottom:1px solid #242a30;text-align:left;white-space:nowrap}th{color:#7f8a95;font-size:11px}.error{padding:10px 14px;background:#32171b;border:1px solid #6d2d35;border-radius:8px;margin-bottom:16px;color:#ff9ca7}footer{text-align:center;color:#69737d;font-size:11px;padding:22px}@media(max-width:900px){.grid{grid-template-columns:1fr}.statusbar{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;gap:20px;flex-direction:column}}</style></head><body><div class="app"><header><div><div class="eyebrow">NSE • 5 MIN • LIVE</div><h1>Inside @ 50 EMA</h1><p>Trend B · 20/50 structure + 50 EMA slope</p></div><div id="clock" class="clock">Waiting…</div></header><nav><button id="liveBtn" class="on">Live Candidates</button><button id="ledgerBtn">Daily Ledger</button><button id="refresh">↻ Refresh</button></nav><section id="statusbar" class="statusbar"></section><div id="error"></div><main id="main"></main><footer>Entries stop at <b>2:45 PM</b> · CAS hard exit <b>3:13 PM</b> · SL-first if both levels are touched in one 5m candle</footer></div><script>
const icon={ELIGIBLE:'⏳',ACTIVE:'✅',TARGET:'🎯',SL:'❌',INVALIDATED:'⚠️',HARD_EXIT:'⏰'};let state={trades:[]},tab='LIVE';
const fmt=n=>n==null?'—':Number(n).toFixed(2); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function buildStatusSummary(state={}){const trades=Array.isArray(state.trades)?state.trades:[];const candles=state.candles&&typeof state.candles==='object'?state.candles:{};const count=status=>trades.filter(t=>t&&t.status===status).length;return{system:state.updatedAt?'ONLINE':'OFFLINE',monitored:Object.keys(candles).length,eligible:count('ELIGIBLE'),active:count('ACTIVE'),target:count('TARGET'),sl:count('SL'),invalidated:count('INVALIDATED'),hardExit:count('HARD_EXIT'),lastUpdate:state.updatedAt??null,sessionDate:state.sessionDate??null}}
function renderStatus(){const s=buildStatusSummary(state);document.getElementById('statusbar').innerHTML=`<div class="statuscard"><small>SYSTEM</small><strong class="${s.system==='ONLINE'?'online':'offline'}">${s.system==='ONLINE'?'🟢':'🔴'} ${s.system}</strong></div><div class="statuscard"><small>STOCKS MONITORED</small><strong>${s.monitored}</strong></div><div class="statuscard"><small>SESSION</small><strong>${s.sessionDate||'—'}</strong></div><div class="statuscard"><small>TODAY'S TRADES</small><strong>${s.target+s.sl+s.hardExit}</strong></div>`}
async function load(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);state=await r.json();document.getElementById('clock').textContent=state.updatedAt?new Date(state.updatedAt).toLocaleTimeString('en-IN'):'Waiting…';document.getElementById('error').innerHTML=state.warning?'<div class="error">'+esc(state.warning)+'</div>':'';renderStatus();render()}catch(e){document.getElementById('error').innerHTML='<div class="error">Scanner/API: '+esc(e.message)+'</div>'}}
function card(t){return `<article class="card"><div class="row"><b>${esc(t.symbol)}</b><span class="${t.side==='LONG'?'long':'short'}">${t.side}</span></div><div class="levels"><div><small>ENTRY</small><strong>${fmt(t.entry)}</strong></div><div><small>TARGET</small><strong>${fmt(t.target)}</strong></div><div><small>SL</small><strong>${fmt(t.sl)}</strong></div></div><div class="meta">${t.childCount||'—'} child · ${t.createdAt?.slice(11,16)||''} · 50 EMA ${fmt(t.ema50)}</div></article>`}
function render(){const ts=state.trades||[];if(tab==='LIVE'){const groups=['ELIGIBLE','ACTIVE'];document.getElementById('main').innerHTML='<div class="grid">'+groups.map(s=>`<section class="panel"><h2>${icon[s]} ${s}</h2><div class="cards">${ts.filter(t=>t.status===s).map(card).join('')||'<div class="empty">No '+s.toLowerCase()+' candidates</div>'}</div></section>`).join('')+'</div>'}else{const rows=ts.filter(t=>!['ELIGIBLE','ACTIVE'].includes(t.status)).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));document.getElementById('main').innerHTML='<main class="ledger"><h2>Today\'s Trade Ledger</h2><table><thead><tr><th>Time</th><th>Stock</th><th>Side</th><th>Entry</th><th>Target</th><th>SL</th><th>Status</th><th>Exit</th></tr></thead><tbody>'+(rows.map(t=>`<tr><td>${esc((t.createdAt||'').slice(11,16))}</td><td>${esc(t.symbol)}</td><td>${t.side}</td><td>${fmt(t.entry)}</td><td>${fmt(t.target)}</td><td>${fmt(t.sl)}</td><td>${icon[t.status]||''} ${t.status}</td><td>${fmt(t.exit)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No completed/invalidated trades yet.</td></tr>')+'</tbody></table></main>'}}
document.getElementById('liveBtn').onclick=()=>{tab='LIVE';liveBtn.className='on';ledgerBtn.className='';render()};document.getElementById('ledgerBtn').onclick=()=>{tab='LEDGER';ledgerBtn.className='on';liveBtn.className='';render()};document.getElementById('refresh').onclick=load;load();setInterval(load,10000);
</script></body></html>
