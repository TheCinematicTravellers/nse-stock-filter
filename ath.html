<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE ATH Forward Monitor</title><style>body{margin:0;background:#0b0e12;color:#eef2f5;font:14px system-ui,sans-serif}.app{max-width:1500px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #28303a;padding-bottom:18px}h1{margin:4px 0;font-size:30px}.muted{color:#8995a1}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.panel{background:#11161c;border:1px solid #29313a;border-radius:12px;padding:14px}.card small{display:block;color:#7f8a95;margin-bottom:6px}.card strong{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{overflow:auto}.panel h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #242b33;text-align:left;white-space:nowrap}th{color:#7f8a95;font-size:11px}.green{color:#55d6a5}.red{color:#ff7181}.yellow{color:#e5bf62}.pill{padding:3px 7px;border-radius:999px;background:#202730}.empty{color:#68737e;padding:15px 0}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div><div class="muted">NSE • FORWARD TESTING ONLY</div><h1>ATH Breakout Monitor</h1><div class="muted">₹50+ NSE equities · D+1 breakout · 1R target · ₹1,00,000 base capital</div></div><div id="updated" class="muted">Loading…</div></header><section id="cards" class="cards"></section><div class="grid"><section class="panel"><h2>🔥 New ATH Events</h2><div id="events"></div></section><section class="panel"><h2>⚡ Active D+1 Setups / Trades</h2><div id="setups"></div></section></div><section class="panel" style="margin-top:16px"><h2>ATH Master</h2><div id="master"></div></section></div><script>const fmt=n=>n==null?'—':Number(n).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function row(cells){return '<tr>'+cells.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}async function load(){try{const r=await fetch('/api/ath/state',{cache:'no-store'});const s=await r.json();if(!r.ok)throw Error(s.error||r.status);const setups=s.tradeSetups||[],events=s.athEvents||[],master=s.athMaster||{};const active=setups.filter(x=>['PENDING_D1','TRIGGERED'].includes(x.status)).length;document.getElementById('cards').innerHTML=[['ATH EVENTS',events.length,''],['ACTIVE',active,'green'],['TRIGGERED',setups.filter(x=>x.status==='TRIGGERED').length,'green'],['INVALIDATED',setups.filter(x=>x.status==='INVALIDATED').length,'red'],['EXPIRED',setups.filter(x=>x.status==='EXPIRED').length,'yellow']].map(x=>`<div class="card"><small>${x[0]}</small><strong class="${x[2]}">${x[1]}</strong></div>`).join('');document.getElementById('events').innerHTML=events.slice().reverse().map(e=>`<div class="card"><b>${esc(e.symbol)}</b> <span class="muted">${e.athDate}</span><div class="muted">ATH ₹${fmt(e.athHigh)} · Day Low ₹${fmt(e.athLow)} · previous ₹${fmt(e.previousAth)}</div></div>`).join('')||'<div class="empty">No NEW ATH events yet.</div>';document.getElementById('setups').innerHTML='<table><thead><tr><th>Stock</th><th>D+1</th><th>Status</th><th>Entry</th><th>SL</th><th>Target</th><th>Qty</th></tr></thead><tbody>'+(setups.slice().reverse().map(x=>row([esc(x.symbol),x.tradingDate,`<span class="pill">${x.status}</span>`,fmt(x.actualEntry??x.plannedEntry),fmt(x.setupLow),fmt(x.target1R),x.quantity])).join('')||'<tr><td colspan="7" class="empty">No setups yet.</td></tr>')+'</tbody></table>';document.getElementById('master').innerHTML='<table><thead><tr><th>Stock</th><th>Adjusted ATH</th><th>ATH Date</th><th>Source</th><th>Updated</th></tr></thead><tbody>'+(Object.entries(master).sort((a,b)=>a[0].localeCompare(b[0])).map(([symbol,x])=>row([esc(symbol),fmt(x.adjustedAthPrice),x.athDate||'—',esc(x.source||'—'),x.updatedAt||'—'])).join('')||'<tr><td colspan="5" class="empty">Baseline not loaded.</td></tr>')+'</tbody></table>';document.getElementById('updated').textContent='Updated '+(s.updatedAt||'—')}catch(e){document.getElementById('updated').textContent='API error: '+e.message}}load();setInterval(load,10000)</script></body></html>
